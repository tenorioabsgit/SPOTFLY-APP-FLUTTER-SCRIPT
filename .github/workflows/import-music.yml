name: Import Copyleft Music

on:
  schedule:
    - cron: '0 0 * * *'  # 00:00 UTC = 21:00 BRT
    - cron: '0 6 * * *'  # 06:00 UTC = 03:00 BRT
    - cron: '0 12 * * *' # 12:00 UTC = 09:00 BRT
    - cron: '0 18 * * *' # 18:00 UTC = 15:00 BRT
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: fetch/log only, skip Storage upload and Postgres writes'
        type: boolean
        default: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run music import
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          DRY_RUN: ${{ (inputs.dry_run && '1') || '' }}
        run: npx tsx scripts/import-music/index.ts
